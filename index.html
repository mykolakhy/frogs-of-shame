<!doctype html>
<html lang="en">
  <head>
    <!-- Cloudflare Web Analytics -->
    <script
      defer
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "f37fba84dbd1440f99ad55938826f5f4"}'
    ></script>
    <!-- End Cloudflare Web Analytics -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>They Are Frogs</title>
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" href="./assets/favicon-32.png" type="image/png" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div>
        <h1>They Are Frogs</h1>
      </div>

      <section id="authPanel" class="auth-panel" aria-label="Account">
        <form id="authForm" class="auth-form">
          <label class="auth-field">
            <span>Email</span>
            <input id="authEmail" type="email" autocomplete="email" required />
          </label>
          <label class="auth-field">
            <span>Password</span>
            <input id="authPassword" type="password" autocomplete="current-password" required minlength="6" />
          </label>
          <div class="auth-actions">
            <button id="authLogIn" type="submit">Log in</button>
            <button id="authSignUp" type="button">Sign up</button>
          </div>
          <p id="authMessage" class="auth-message" role="status" hidden></p>
        </form>

        <div id="authSession" class="auth-session" hidden>
          <span id="authSessionEmail"></span>
          <button id="authLogOut" type="button">Log out</button>
        </div>
      </section>
    </header>

    <main>
      <section class="search-panel" aria-labelledby="search-title">
        <div>
          <h2 id="search-title">Find a frog</h2>
          <p>
            Search by name, color, mood, material, theme, or any tag in the
            catalog.
          </p>
        </div>
        <label class="search-box">
          <span>Search frogs</span>
          <input
            id="searchInput"
            type="search"
            placeholder="Try: cosmic, radioactive, bronze, cursed"
            autocomplete="off"
          />
        </label>
      </section>

      <section class="toolbar" aria-live="polite">
        <span id="resultCount">Loading frogs...</span>
        <button id="clearSearch" type="button">Clear</button>
      </section>

      <section
        id="frogGrid"
        class="frog-grid"
        aria-label="Frog image results"
      ></section>

      <section id="emptyState" class="empty-state" hidden>
        <h2>No frogs found</h2>
        <p>Try a broader search term or add another tag to the frog catalog.</p>
      </section>
    </main>

    <template id="frogCardTemplate">
      <article class="frog-card">
        <a class="image-link" target="_blank" rel="noreferrer">
          <img loading="lazy" alt="" />
        </a>
        <div class="frog-card-body">
          <div>
            <h2></h2>
            <p class="description"></p>
          </div>
          <ul class="tag-list" aria-label="Tags"></ul>
          <a class="download-button" download>Download PNG</a>
        </div>
      </article>
    </template>

    <script src="./auth.js" type="module"></script>
    <script src="./script.js" type="module"></script>
  </body>
</html>
